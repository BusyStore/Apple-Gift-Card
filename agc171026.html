<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busy Store - Protected Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card-container {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      width: 90%;
      max-width: 400px;
    }
    input {
      padding: 10px;
      width: 80%;
      border-radius: 8px;
      border: 1px solid #475569;
      margin-bottom: 12px;
      text-align: center;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    .hidden {
      display: none;
    }
    .card-info {
      background: #ffffff;
      color: #000000;
      padding: 16px;
      border-radius: 12px;
      margin-top: 16px;
    }
    .code-box {
      font-weight: bold;
      color: #d97706;
      font-size: 18px;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="card-container">
  <!-- Password မရိုက်မီ ပေါ်မည့်အပိုင်း -->
  <div id="password-section">
    <h3>Busy Store</h3>
    <p>Gift Card ဝင်ကြည့်ရန် Password ရိုက်ထည့်ပါ</p>
    <input type="password" id="passInput" placeholder="Enter Password"><br>
    <button onclick="checkPassword()">Unlock Card</button>
    <p id="error-msg" style="color: #ef4444; display: none; margin-top: 10px;">Password မှားယွင်းနေပါသည်။</p>
  </div>

  <!-- Password မှန်မှ ပေါ်လာမည့် Card Details -->
  <div id="card-section" class="hidden">
    <h2 style="color: #eab308;">APPLE GIFT CARD</h2>
    <h3>$2.00 USD</h3>
    <div class="card-info">
      <p>GIFT CARD DETAILS</p>
      <p class="code-box">CODE: XX9X-27QR-2WT6-J3Q6</p>
      <p>PIN: 6aa9ad389d381</p>
    </div>
    <p style="color: #94a3b8; font-size: 12px; margin-top: 16px;">Thank you for shopping with Busy Store!</p>
  </div>
</div>

<script>
  function checkPassword() {
    // ဤနေရာတွင် Customer ကို ပေးမည့် Password ပြောင်းပါ
    const correctPassword = "KZTA"; 

    const userPassword = document.getElementById("passInput").value;
    if (userPassword === correctPassword) {
      document.getElementById("password-section").classList.add("hidden");
      document.getElementById("card-section").classList.remove("hidden");
    } else {
      document.getElementById("error-msg").style.display = "block";
    }
  }
</script>

</body>
</html>
