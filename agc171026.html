<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busy Store - Apple Gift Card $2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Card Container - Luxury Rounded Frame */
        .card-container {
            width: 420px;
            background: #ffffff;
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }

        /* 1. Header Logo */
        .logo-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            max-width: 180px;
            max-height: 55px;
            object-fit: contain;
        }

        /* 2. Title & Amount Section */
        .title-section {
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #0f172a;
            text-transform: uppercase;
        }

        .card-amount {
            font-size: 26px;
            font-weight: 800;
            color: #d4af37; /* Luxury Gold */
            margin-top: 4px;
        }

        /* 3. Gift Card Image (Clean No-Border) */
        .card-image-wrapper {
            margin: 0 auto 24px auto;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .gift-card-img {
            width: 280px;
            height: 175px;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: none;
            border: none;
        }

        /* 4. Voucher Code & PIN Area */
        .details-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 24px;
        }

        .details-header {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        /* Code Row */
        .code-box {
            background: #fffbeb;
            border: 1.5px dashed #f59e0b;
            border-radius: 12px;
            padding: 12px 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: 700;
            color: #b45309;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            white-space: nowrap;
        }

        /* PIN Row */
        .pin-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* 5. Footer Text */
        .footer-text {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 1. Store Logo Link -->
        <div class="logo-container">
            <img class="logo-img" src="https://i.ibb.co/XfhKFB5B/lv-0-20260917001152.png" alt="Busy Store Logo">
        </div>

        <!-- 2. Header Title & Amount -->
        <div class="title-section">
            <div class="card-title">Apple Gift Card</div>
            <div class="card-amount">$2.00 USD</div>
        </div>

        <!-- 3. Apple Gift Card Image Link -->
        <div class="card-image-wrapper">
            <img class="gift-card-img" src="https://i.ibb.co/SwN0Qvdb/apple-gift-card-100.png" alt="Apple Gift Card">
        </div>

        <!-- 4. Code & PIN Box -->
        <div class="details-box">
            <div class="details-header">Gift Card Details</div>
            
            <div class="code-box">
                CODE: XX9X-27QR-2WT6-J3Q6
            </div>
            
            <div class="pin-box">
                PIN: 6aa9ad389d381
            </div>
        </div>

        <!-- 5. Footer -->
        <div class="footer-text">
            Thank you for shopping with Busy Store!
        </div>
    </div>

</body>
</html>
