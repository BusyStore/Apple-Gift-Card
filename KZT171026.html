<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busy Store - Apple Gift Card</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b132b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card-container {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 28px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .store-logo {
      width: 60px;
      height: 60px;
      margin-bottom: 12px;
      object-fit: contain;
    }
    .title {
      font-size: 18px;
      font-weight: 800;
      color: #1a1a1a;
      letter-spacing: 0.5px;
      margin: 0 0 6px 0;
    }
    .amount {
      font-size: 20px;
      font-weight: 700;
      color: #d99b00;
      margin: 0 0 20px 0;
    }
    
    /* Card Image Section */
    .apple-card-box {
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .apple-logo-img {
      width: 100%;
      max-width: 140px;
      height: auto;
      object-fit: contain;
    }

    /* Input Section Styles */
    .input-box {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      text-align: center;
      margin-bottom: 12px;
      outline: none;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background-color: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    /* Details Box Section */
    .details-box {
      background-color: #f8fafc;
      border: 1px solid #f1f5f9;
      border-radius: 20px;
      padding: 20px 16px;
    }
    .details-title {
      font-size: 11px;
      font-weight: 700;
      color: #8e8e93;
      letter-spacing: 0.8px;
      margin: 0 0 14px 0;
    }
    .code-field {
      background-color: #fffde7;
      border: 1.5px dashed #fbc02d;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #b78103;
      word-break: break-all;
      margin-bottom: 10px;
    }
    .pin-field {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      color: #334155;
      word-break: break-all;
    }
    .footer-text {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 24px;
      margin-bottom: 0;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="card-container">
  <!-- Busy Store Logo -->
  <img src="busystore.png" alt="Busy Store Logo" class="store-logo">

  <!-- Password Locked View (Lock Screen) -->
  <div id="lock-section">
    <h1 class="title">APPLE GIFT CARD</h1>
    <p class="amount">$2.00 USD</p>

    <!-- Apple Card Logo (Lock Screen ပေါ်တွင် ပေါ်စေရန်) -->
    <div class="apple-card-box">
      <img src="applegc.png" alt="Apple Logo" class="apple-logo-img">
    </div>

    <input type="password" id="passInput" class="input-box" placeholder="Enter Password">
    <button onclick="checkPassword()" class="btn">Unlock Card</button>
    <p id="error-msg" style="color: #ef4444; font-size: 13px; display: none; margin-top: 10px;">Password မှားယွင်းနေပါသည်။</p>
  </div>

  <!-- Unlocked View (Password ရိုက်ပြီးသည့်အချိန်) -->
  <div id="card-section" class="hidden">
    <h1 class="title">APPLE GIFT CARD</h1>
    <p class="amount">$2.00 USD</p>

    <!-- Apple Card Logo (Unlocked View ပေါ်တွင် ပေါ်စေရန်) -->
    <div class="apple-card-box">
      <img src="applegc.png" alt="Apple Logo" class="apple-logo-img">
    </div>

    <!-- Gift Card Details Box -->
    <div class="details-box">
      <p class="details-title">GIFT CARD DETAILS</p>
      <div class="code-field">
        CODE: XX9X-27QR-2WT6-J3Q6
      </div>
      <div class="pin-field">
        PIN: 6aa9ad389d381
      </div>
    </div>

    <p class="footer-text">Thank you for shopping with Busy Store!</p>
  </div>
</div>

<script>
  function checkPassword() {
    const correctPassword = "1234"; // Password ပြောင်းရန်

    const userPassword = document.getElementById("passInput").value;
    if (userPassword === correctPassword) {
      document.getElementById("lock-section").classList.add("hidden");
      document.getElementById("card-section").classList.remove("hidden");
    } else {
      document.getElementById("error-msg").style.display = "block";
    }
  }
</script>

</body>
</html>
